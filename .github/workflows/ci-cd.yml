name: CI/CD Pipeline

on:
  push:
    branches:
      - testing   # run pipeline when code is pushed to "testing"
  pull_request:
    branches:
      - main      # enforce checks before merging into main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Log in to DockerHub (hardcoded credentials)
      - name: Log in to DockerHub
        run: |
          echo "Muthengi.2010" | docker login -u "alimaekaya" --password-stdin

      # Step 3: Build Docker image
      - name: Build Docker image
        run: |
          cd frontend
          docker build -t alimaekaya/sit822-frontend:latest .

      # Step 4: Push Docker image
      - name: Push Docker image
        run: |
          docker push alimaekaya/sit822-frontend:latest
